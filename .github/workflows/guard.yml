name: guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  no-game-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse game content, keys and oversized files
        run: python3 tools/check_no_game_content.py .
      - name: Refuse disguised content and signing material
        run: python3 tools/check_letsgo_content.py
      - name: Refuse secrets in working tree and history
        run: python3 tools/check_no_secrets.py --history
  kit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard unit tests
        run: python3 -m unittest discover -s tests -p 'test*guard*.py' -v
      - name: Existing content guard tests
        run: python3 -m unittest discover -s tests -p test_check_no_game_content.py -v
      - name: Refuse internal infrastructure in tracked files
        run: python3 -m unittest discover -s tests -p test_no_internal_infra.py -v
      - name: Milestone placement tests (static, no device)
        run: python3 -m unittest discover -s tests -p test_milestone_markers.py -v
      - name: Host-check preparation contract (no toolchain required)
        run: python3 -m unittest discover -s engine/tests -p test_run_host_checks_preconditions.py -v
      - name: Setup-check tests
        run: bash tests/test_setup_check.sh
      - name: Syntax of the kit scripts
        run: |
          for f in tools/setup.sh docs/ai-kit/sync-to.sh tests/test_setup_check.sh; do bash -n "$f"; done
          python3 - <<'PY'
          import re, pathlib
          for p in pathlib.Path("skills").glob("*/SKILL.md"):
              t = p.read_text()
              m = re.match(r"---\nname: (.+)\ndescription: (.+)\n---\n", t)
              assert m and m.group(1) == p.parent.name, f"bad frontmatter: {p}"
          print("skills frontmatter OK")
          PY
