# deps.lock — every third-party input of the AC-NativeNX APK, pinned (model: letsgo-recomp-android's deps.lock).
#
# Read by tools/deps.py (CI `build` workflow) and tests/test_deps_lock.py. Fields are separated by `|` (spaces around
# them are ignored). Lines starting with `#` are comments. Every line has 7 fields:
#
#   kind | name | version | license (SPDX) | in source tarball (yes/no) | sha256 | url
#
#   dep    Source compiled into, or file packaged in, the default APK (no --with-ondevice, no --with-native-blocks).
#          Downloaded from its upstream and checked against sha256; "yes" = the archive is copied unmodified into
#          AC-NativeNX-<ver>-source.tar.gz (deps/dl/), which therefore holds the complete corresponding source.
#   unused Downloaded by a pinned upstream build script but neither compiled into nor shipped in the APK. Listed so
#          that every download of the build is accounted for; never fetched by tools/deps.py.
#   cpm    An entry of shell/cpmfile.json (Eden's C++ dependencies). NOT BUILT: the Android build of the CI
#          (engine/tools/build_eden_shell.py, Gradle project shell/src/android/raitchi-build) has no
#          externalNativeBuild, so neither Eden's C++ core nor any CPM package is compiled, and build_eden_shell.py
#          refuses an APK whose native libraries differ from the engine's ("Eden core must not be packaged").
#          This includes the `"ci": true` entries (ffmpeg-ci, openssl-ci, sdl3-ci: prebuilt binaries of crueter-ci;
#          sirit-ci). Version and repository only; tests/test_deps_lock.py keeps this list equal to cpmfile.json and
#          fails if the Android build starts compiling native shell code.
#
# Not covered here: the Android SDK/NDK and Gradle toolchain (installed by sdkmanager / Gradle, which check their own
# downloads), and the Maven libraries of shell/src/android/app/build.gradle.kts (androidx, Material, Kotlin, OkHttp,
# Coil, Jackson, commonmark...; Apache-2.0 / MIT / BSD binaries resolved by Gradle).
#
# Versions are the ones the build uses: engine/sources.lock.json, engine/echoes-source.lock.json,
# engine/shell.lock.json (Eden base), LAS Android's tools/android/build_deps.sh and android/app/CMakeLists.txt at the
# pinned las-android commit, engine/tools/build_letsgo_ffmpeg.py, engine/tools/prepare_shared_ondevice.py, and
# shaderc v2026.3's DEPS file. `tools/deps.py check` verifies each of these against this file.

